volumes:
  dispatch_db_data:
  dispatch_static:
  dispatch_media:
  dispatch_redis_data:
  dispatch_grafana_data:
  dispatch_prometheus_data:

networks:
  dispatch_network:
    driver: bridge

# Общая конфигурация логирования
x-log-opts: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  # PostgreSQL
  dispatch_db:
    image: postgres:13.10
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - dispatch_db_data:/var/lib/postgresql/data
    networks:
      - dispatch_network
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "md5"
      TZ: "Europe/Moscow"
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=300
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB

  # Redis (для кэша)
  dispatch_redis:
    image: redis:7-alpine
    container_name: dispatch_redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - dispatch_redis_data:/data
    networks:
      - dispatch_network
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: "Europe/Moscow"

  # RabbitMQ (для Celery broker + optional result backend)
  dispatch_rabbitmq:
    image: rabbitmq:3.12-management
    container_name: dispatch_rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: "Europe/Moscow"
    networks:
      - dispatch_network
    restart: unless-stopped

  # Celery worker (основные задачи: отправка писем, уведомлений, автозакрытие и т.д.)
  dispatch_celery_worker:
    <<: *default-logging
    build:
      context: .
    working_dir: /app
    command: >
      celery -A backend.celery worker --loglevel=error --logfile=/app/logs/celery/celery_worker.log -Q default,low,medium,high  --concurrency=2
    env_file: .env
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - dispatch_media:/app/media
      - dispatch_static:/app/collected_static
      - ./logs:/app/logs        # bind mount для логов
      - ./data:/app/data        # bind mount для data
    depends_on:
      - dispatch_db
      - dispatch_rabbitmq
    networks:
      - dispatch_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G  # Ограничиваем контейнер 2 ГБ
        reservations:
          memory: 1G  # Гарантируем 1 ГБ (опционально)

  # Celery worker (тяжелые задачи: формирование отчетов)
  dispatch_celery_heavy_worker:
    <<: *default-logging
    build:
      context: .
    working_dir: /app
    command: celery -A backend.celery worker --loglevel=error --logfile=/app/logs/celery/celery_heavy_worker.log -Q heavy --concurrency=2
    env_file: .env
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - dispatch_media:/app/media
      - dispatch_static:/app/collected_static
      - ./logs:/app/logs        # bind mount для логов
      - ./data:/app/data        # bind mount для data
    depends_on:
      - dispatch_db
      - dispatch_rabbitmq
    networks:
      - dispatch_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G  # Больше памяти для тяжелых задач
        reservations:
          memory: 1.5G

  # Celery worker (планировщик задач)
  dispatch_celery_beat:
    <<: *default-logging
    build: .
    command: celery -A backend.celery beat --loglevel=error --logfile=/app/logs/celery/celery_beat.log
    env_file: .env
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - dispatch_media:/app/media
      - dispatch_static:/app/collected_static
      - ./logs:/app/logs        # bind mount для логов
      - ./data:/app/data        # bind mount для data
    depends_on:
      - dispatch_db
      - dispatch_rabbitmq
    networks:
      - dispatch_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M  # Минимум для beat
        reservations:
          memory: 256M

  # Django backend
  dispatch_backend:
    build:
      context: .
    env_file: .env
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - dispatch_media:/app/media
      - dispatch_static:/app/collected_static
      - ./logs:/app/logs        # bind mount для логов
      - ./data:/app/data        # bind mount для data
      - ./.env:/app/.env:ro   # монтируем .env внутрь контейнера (для cron)
    depends_on:
      - dispatch_db
      - dispatch_rabbitmq
      - dispatch_redis
    networks:
      dispatch_network:
        aliases:
          - dispatch-backend
    restart: unless-stopped

  # Grafana (визуализация)
  dispatch_grafana:
    image: grafana/grafana:latest
    container_name: dispatch_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Moscow
      - GF_SERVER_ROOT_URL=${GRAFANA_PUBLIC_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_FORCE_HTTPS=false

      # Базовые настройки безопасности
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=false

      # Включает гостевой доступ
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer

      # Auth Proxy (для Django)
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_SYNC_TTL=60
      - GF_AUTH_PROXY_WHITELIST=127.0.0.1,::1
      
      # Кэш и логи
      - GF_DATASOURCE_QUERY_CACHE_ENABLED=true
      - GF_DATASOURCE_QUERY_CACHE_MAX_ENTRIES=1000
      - GF_DATASOURCE_QUERY_CACHE_TTL=60s
      - GF_LOG_LEVEL=error
      - GF_LOG_MODE=file
      - GF_LOG_FILE=/var/log/grafana/grafana.log

      # Разрешить встраивание (важно для iframe)
      - GF_SECURITY_ALLOW_EMBEDDING=true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3" 

    volumes:
      - dispatch_grafana_data:/var/lib/grafana
      - ./logs/grafana:/var/log/grafana
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - dispatch_network
    depends_on:
      - dispatch_db
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx
  dispatch_gateway:
    build:
      context: ./gateway/
    ports:
      - "8000:80"
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - dispatch_static:/staticfiles/
      - dispatch_media:/mediafiles/
      - ./logs/nginx:/var/log/nginx   # отдельная папка под nginx-логи
    depends_on:
      - dispatch_backend
      - dispatch_grafana
    networks:
      - dispatch_network
    restart: unless-stopped

  # Prometheus
  dispatch_prometheus:
    image: prom/prometheus:latest
    container_name: dispatch_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - dispatch_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=2GB'
    environment:
      TZ: "Europe/Moscow"
    networks:
      - dispatch_network
    depends_on:
      - dispatch_backend
      - dispatch_cadvisor
      - dispatch_node_exporter
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Node Exporter (мониторинг сервера: CPU, RAM, диск, сеть)
  dispatch_node_exporter:
    image: prom/node-exporter:latest
    container_name: dispatch_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    environment:
      TZ: "Europe/Moscow"
    networks:
      - dispatch_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Сбора метрик запущенных контейнеров
  dispatch_cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: dispatch_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dispatch_network
    environment:
      TZ: "Europe/Moscow"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M