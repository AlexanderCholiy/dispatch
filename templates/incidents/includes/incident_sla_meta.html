<div class="incident-meta-sla">

  <!-- Start -->
  <div class="field-group {% if start_field.errors %}has-error{% endif %}">
    <label for="{{ start_field.id_for_label }}" class="field-label incident-meta-label">
      <div class="incident-meta-label-left">{{ start_field.label }}</div>
      <div class="incident-meta-label-right">
        {% if start_field.name == "avr_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между регистрацие и передачей на АВР: {{ incident.avr_transfer_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "rvr_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между регистрацие и передачей на РВР: {{ incident.rvr_transfer_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "dgu_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между регистрацие и передачей на ДГУ: {{ incident.dgu_transfer_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "eks_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между регистрацие и передачей на ЭКС: {{ incident.eks_transfer_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% endif %}
      </div>
    </label>

    <div class="field-control">
      {{ start_field }}
    </div>

    {% if start_field.errors %}
      <div class="field-errors">
        {% for error in start_field.errors %}
          <span class="form-error">{{ error }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </div>

  <!-- End -->
  <div class="field-group {% if end_field.errors %}has-error{% endif %}">
    <label for="{{ end_field.id_for_label }}" class="field-label incident-meta-label">
      <div class="incident-meta-label-left">{{ end_field.label }}</div>
      <div class="incident-meta-label-right">
        {% if end_field.name == "avr_end_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между завершением АВР и закрытием инцидента: {{ incident.avr_close_to_finish_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif end_field.name == "rvr_end_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между завершением РВР и закрытием инцидента: {{ incident.rvr_close_to_finish_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif end_field.name == "dgu_end_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между завершением ДГУ и закрытием инцидента: {{ incident.dgu_close_to_finish_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif end_field.name == "eks_end_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL между завершением ЭКС и закрытием инцидента: {{ incident.eks_close_to_finish_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% endif %}
      </div>
    </label>

    <div class="field-control">
      {{ end_field }}
    </div>

    {% if end_field.errors %}
      <div class="field-errors">
        {% for error in end_field.errors %}
          <span class="form-error">{{ error }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </div>

  <!-- SLA Block -->
  <div class="field-group sla-group">
    <label class="field-label incident-meta-label">
      <div class="incident-meta-label-left">{{ label }}</div>
      <div class="incident-meta-label-right">
        {% if start_field.name == "avr_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL АВР: {{ incident.avr_duration_val_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "rvr_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL РВР: {{ incident.rvr_duration_val_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "dgu_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL ДГУ: {{ incident.dgu_transfer_delta_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% elif start_field.name == "eks_start_date" %}
          <span class="tooltip incident-meta-info" 
                data-title="TTL ЭКС: {{ incident.eks_duration_val_label|default:'—' }}">
            <i class="bx bx-info-circle" style="font-weight: bold"></i>
          </span>
        {% endif %}
      </div>
    </label>

    <div class="sla-wrapper">
      <span
        class="status-tag {{ status.value|default:'unknown' }} {% if deadline %}tooltip{% endif %}"
        data-title="{{ start|date:'d.m.Y H:i' }} — {{ deadline|date:'d.m.Y H:i' }}"
      >
        {{ status.label|default:'Отсутствует' }}
      </span>
    </div>
  </div>

</div>
