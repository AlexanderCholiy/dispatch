<div class="stages-footer">
  {% if can_manage %}
    <button type="button" class="btn btn-secondary" id="stages-add-row">
      Добавить этап
    </button>

    <div class="stages-footer-actions">
      <a href="{{ back_url }}" class="btn btn-secondary">Отмена</a>
      <button type="submit" class="btn btn-sm btn-primary">Сохранить</button>
    </div>
  {% else %}
    <div class="stages-footer-actions">
      <a href="{{ back_url }}" class="btn btn-secondary">Назад</a>
    </div>
  {% endif %}
</div>
